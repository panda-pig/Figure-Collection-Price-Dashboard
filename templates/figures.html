{% extends "base.html" %}

{% block title %}Figures | Figure Collection{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <p class="eyebrow" data-i18n="figures.eyebrow">商品マスター</p>
    <h1 data-i18n="figures.title">Figures</h1>
  </div>
  <div class="header-actions">
    <button id="addFigure" class="button primary write-only" type="button" data-i18n="figures.addFigure">Add Figure</button>
    <button id="clearFilters" class="button secondary" type="button" data-i18n="common.reset">Reset</button>
  </div>
</header>

<section class="panel filters" aria-label="Figure filters" data-i18n-aria-label="aria.figureFilters">
  <label>
    <span data-i18n="common.search">Search</span>
    <input id="keyword" class="control" type="search" placeholder="商品名 / 作品 / ブランド" data-i18n-placeholder="figures.searchPlaceholder">
  </label>
  <label>
    <span data-i18n="common.brand">Brand</span>
    <select id="brand" class="control"></select>
  </label>
  <label>
    <span data-i18n="common.series">Series</span>
    <select id="series_title" class="control"></select>
  </label>
  <label>
    <span data-i18n="table.manufacturer">Manufacturer</span>
    <select id="manufacturer" class="control"></select>
  </label>
  <label>
    <span data-i18n="figures.releaseMonth">Release month</span>
    <select id="release_month" class="control"></select>
  </label>
  <label>
    <span data-i18n="common.status">Status</span>
    <select id="status" class="control"></select>
  </label>
  <label>
    <span data-i18n="common.price">Price</span>
    <select id="priceRange" class="control">
      <option value="" data-i18n="common.all">All</option>
      <option value="0-5000" data-i18n="figures.priceUnder5000">5000円以下</option>
      <option value="0-10000" data-i18n="figures.priceUnder10000">10000円以下</option>
      <option value="10000-" data-i18n="figures.priceOver10000">10000円以上</option>
    </select>
  </label>
  <label>
    <span data-i18n="common.limited">Limited</span>
    <select id="is_limited" class="control">
      <option value="" data-i18n="common.all">All</option>
      <option value="1" data-i18n="status.limited">限定</option>
      <option value="0" data-i18n="status.regular">一般</option>
    </select>
  </label>
  <label>
    <span data-i18n="figures.articulation">Articulation</span>
    <select id="is_articulated" class="control">
      <option value="" data-i18n="common.all">All</option>
      <option value="1" data-i18n="status.articulated">可動</option>
      <option value="0" data-i18n="status.fixed">不可動</option>
    </select>
  </label>
</section>

<section class="panel table-panel">
  <div class="panel-head">
    <div>
      <h2 data-i18n="figures.productList">Product List</h2>
      <p id="resultCount" data-i18n="common.loading">Loading</p>
    </div>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th data-i18n="table.figureName">商品名</th>
          <th data-i18n="common.brand">ブランド</th>
          <th data-i18n="common.series">作品</th>
          <th data-i18n="table.manufacturer">メーカー</th>
          <th data-i18n="table.release">発売</th>
          <th data-i18n="common.price">価格</th>
          <th data-i18n="table.attributes">属性</th>
          <th data-i18n="common.status">状態</th>
          <th data-i18n="table.actions">操作</th>
        </tr>
      </thead>
      <tbody id="figuresTable"></tbody>
    </table>
  </div>
  <div id="figuresPager" class="pager" hidden></div>
</section>

<dialog id="figureDialog" class="modal">
  <form id="figureForm" class="modal-card" method="dialog">
    <div class="panel-head">
      <div>
        <h2 id="figureDialogTitle">New Figure</h2>
      </div>
      <button id="closeFigureDialog" class="icon-button" type="button" aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <label>
      <span data-i18n="table.figureName">Figure name</span>
      <input name="name" class="control" required data-i18n-placeholder="figures.namePlaceholder">
    </label>
    <div class="field-grid">
      <label>
        <span data-i18n="common.brand">Brand</span>
        <input name="brand" class="control">
      </label>
      <label>
        <span data-i18n="common.series">Series</span>
        <input name="series_title" class="control">
      </label>
    </div>
    <div class="field-grid">
      <label>
        <span data-i18n="table.manufacturer">Manufacturer</span>
        <input name="manufacturer" class="control">
      </label>
      <label>
        <span data-i18n="table.release">Release</span>
        <input name="release_date" class="control" data-i18n-placeholder="figures.releaseDatePlaceholder">
      </label>
    </div>
    <div class="field-grid">
      <label>
        <span data-i18n="table.officialPrice">Official price</span>
        <input name="official_price" class="control" type="number" min="0" step="1">
      </label>
      <label>
        <span data-i18n="table.height">Height (mm)</span>
        <input name="height_mm" class="control" type="number" min="0" step="1">
      </label>
    </div>
    <div class="field-grid">
      <label>
        <span data-i18n="table.scale">Scale</span>
        <input name="scale" class="control" placeholder="1/7 / non-scale">
      </label>
      <label>
        <span data-i18n="common.status">Status</span>
        <input name="status" class="control" placeholder="予約中 / 発売予定">
      </label>
    </div>
    <label>
      <span data-i18n="table.productUrl">Product URL</span>
      <input name="product_url" class="control" type="url" placeholder="https://">
    </label>
    <label>
      <span data-i18n="table.imageUrl">Image URL</span>
      <input name="image_url" class="control" type="url" placeholder="https://">
    </label>
    <div class="field-grid">
      <label class="checkbox-row">
        <input name="is_articulated" type="checkbox">
        <span data-i18n="status.articulated">Articulated</span>
      </label>
      <label class="checkbox-row">
        <input name="is_limited" type="checkbox">
        <span data-i18n="status.limited">Limited</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="button secondary" type="button" data-action="cancel" data-i18n="common.cancel">Cancel</button>
      <button class="button primary" type="submit" data-i18n="figures.saveFigure">Save Figure</button>
    </div>
  </form>
</dialog>

<dialog id="collectionDialog" class="modal">
  <form id="collectionForm" class="modal-card" method="dialog">
    <div class="panel-head">
      <div>
        <h2 data-i18n="collection.addToCollection">Add to Collection</h2>
        <p id="collectionFigureName">-</p>
      </div>
      <button id="closeCollectionDialog" class="icon-button" type="button" aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <input id="collectionFigureId" name="figure_id" type="hidden">
    <div class="field-grid">
      <label>
        <span data-i18n="common.status">Status</span>
        <select id="collectionStatus" name="ownership_status" class="control" required></select>
      </label>
      <label>
        <span data-i18n="table.purchasePrice">Purchase price</span>
        <input name="purchase_price" class="control" type="number" min="0" step="1">
      </label>
    </div>
    <div class="field-grid">
      <label>
        <span data-i18n="table.purchaseShop">Purchase shop</span>
        <input name="purchase_shop" class="control" placeholder="あみあみ / 駿河屋 / メルカリ">
      </label>
      <label>
        <span data-i18n="table.purchaseDate">Purchase date</span>
        <input name="purchase_date" class="control" type="date">
      </label>
    </div>
    <label>
      <span data-i18n="collection.displayLocation">Display location</span>
      <input name="display_location" class="control" placeholder="ガラスケース A" data-i18n-placeholder="collection.displayLocationPlaceholder">
    </label>
    <label class="checkbox-row">
      <input name="is_opened" type="checkbox">
      <span data-i18n="table.opened">Opened</span>
    </label>
    <label>
      <span data-i18n="table.memo">Memo</span>
      <textarea name="memo" class="control textarea" rows="3"></textarea>
    </label>
    <div class="modal-actions">
      <button class="button secondary" type="button" data-action="cancel" data-i18n="common.cancel">Cancel</button>
      <button class="button primary" type="submit" data-i18n="collection.saveCollection">Save Collection</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/figures.js') }}?v={{ asset_version }}"></script>
{% endblock %}
